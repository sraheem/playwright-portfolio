name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 11 * * *' # daily run surfaces flaky tests against the live demo sites
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [ui-chromium, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Install browsers
        if: matrix.project != 'api'
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload HTML report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
